<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanças do Casal</title>
<meta name="theme-color" content="#1d5bd3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: coluna única de app (máx. 760px) — cabeçalho com o mês, conteúdo, abas fixas embaixo e botão + flutuante */
  --bg: #eef2f8;
  --surface: #ffffff;
  --ink: #142035;
  --muted: #5a6680;
  --line: #dde3ee;
  --accent: #1d5bd3;
  --accent-ink: #ffffff;
  --accent-soft: #e4ecfb;
  --pos: #11804b;
  --neg: #c2410c;
  --warn: #a96300;
  --shadow: 0 1px 2px rgba(20, 32, 53, .06), 0 4px 16px rgba(20, 32, 53, .06);
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1220; --surface: #151d2e; --ink: #e8eef8; --muted: #9aa6bd; --line: #26314a;
    --accent: #7aa5ff; --accent-ink: #0b1324; --accent-soft: #1b2948;
    --pos: #4fd28f; --neg: #ff8d5c; --warn: #f0b64a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1220; --surface: #151d2e; --ink: #e8eef8; --muted: #9aa6bd; --line: #26314a;
  --accent: #7aa5ff; --accent-ink: #0b1324; --accent-soft: #1b2948;
  --pos: #4fd28f; --neg: #ff8d5c; --warn: #f0b64a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .money-big, td.v { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }

.app { max-width: 760px; margin: 0 auto; padding: 0 16px 120px; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0 10px; display: grid; gap: 10px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 20px; }
.brand .pair { display: flex; }
.brand .pair span { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--bg); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.brand .pair span + span { margin-left: -7px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }
.month { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.month button { border: 0; background: transparent; width: 38px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.month button:hover { background: var(--accent-soft); }
.month .label { flex: 1; text-align: center; font-weight: 600; }
.month .hoje { width: auto; padding: 0 10px; font-size: 13px; color: var(--accent); font-weight: 600; }

main { display: grid; gap: 14px; padding-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.card h2 { font-size: 17px; }
.card .sub { color: var(--muted); font-size: 13px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.money-big { font-family: var(--font-display); font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { display: grid; gap: 2px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); }

.stack { height: 12px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; display: flex; }
.stack i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.meter { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.meter.warn i { background: var(--warn); } .meter.neg i { background: var(--neg); } .meter.pos i { background: var(--pos); }

.people { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 560px) { .people { grid-template-columns: 1fr; } }
.person { border-top: 4px solid var(--pc, var(--accent)); }
.who { display: flex; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; flex: none; }
.who .name { font-weight: 700; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.badge svg { width: 12px; height: 12px; }
.rows { display: grid; gap: 6px; }
.rowkv { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.rowkv .k { color: var(--muted); }
.rowkv .v { white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.rowkv.total { border-top: 1px dashed var(--line); padding-top: 8px; font-size: 15px; }
.rowkv.total .k { color: var(--ink); font-weight: 600; }

.list { display: grid; }
.day { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: capitalize; padding: 10px 2px 4px; }
.item { cursor: pointer; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.item:last-child { border-bottom: 0; }
.item:hover { background: color-mix(in srgb, var(--accent-soft) 50%, transparent); }
.ico { width: 38px; height: 38px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; font-size: 18px; position: relative; }
.ico .dot { position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface); }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .r { display: grid; justify-items: end; gap: 3px; }
.item .val { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.pill.pago { background: color-mix(in srgb, var(--pos) 14%, transparent); color: var(--pos); }
.pill.pendente { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
button.pill { cursor: pointer; }

.cats { display: grid; gap: 8px; }
.cat-row { display: grid; grid-template-columns: 22px minmax(70px, 140px) minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 13px; }
.cat-row .bar { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.cat-row .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.cat-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-row .vv { font-weight: 600; font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.note { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); }
.note svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; font-size: 14px; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: color-mix(in srgb, var(--neg) 14%, transparent); color: var(--neg); }
.btn.block { width: 100%; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; min-width: 140px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0; }

.settle { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: var(--accent-soft); }
.settle .arrow { color: var(--muted); }
.settle .amt { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.split { display: flex; height: 10px; border-radius: 999px; overflow: hidden; }

.trip-hero { background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 16%, var(--surface)), var(--surface) 70%); }
.trip-dest { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.ring-wrap { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center; }
@media (max-width: 400px) { .ring-wrap { grid-template-columns: 96px 1fr; } }
.ring { width: 100%; aspect-ratio: 1; }
.ring text { font-family: var(--font-display); font-weight: 700; fill: var(--ink); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs a { display: grid; justify-items: center; gap: 2px; padding: 8px 4px 10px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600; }
nav.tabs a svg { width: 22px; height: 22px; }
nav.tabs a[aria-current="page"] { color: var(--accent); }
.fab { position: fixed; z-index: 7; right: max(16px, calc(50% - 380px + 16px)); bottom: calc(76px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 40%, transparent); display: grid; place-items: center; }
.fab svg { width: 26px; height: 26px; }

.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(8, 12, 22, .45); display: grid; align-items: end; justify-items: center; }
@media (min-width: 640px) { .scrim { align-items: center; } }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px 16px 24px; display: grid; gap: 14px; }
@media (min-width: 640px) { .sheet { border-radius: 20px; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-head h2 { font-size: 19px; }
.field { display: grid; gap: 6px; }
.field > span, .field > label { font-size: 13px; font-weight: 600; color: var(--muted); }
.input, select.input { font-size: 16px; width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px 12px; }
.money-in { display: flex; align-items: center; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 0 12px; }
.money-in span { color: var(--muted); font-weight: 600; }
.money-in input { border: 0; background: transparent; padding: 10px 8px; font-family: var(--font-display); font-weight: 700; font-size: 26px; width: 100%; outline: none; }
.money-in:focus-within { outline: 2px solid var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 8px 6px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg input:checked + label { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); }
.catpick { display: flex; flex-wrap: wrap; gap: 6px; }
.catpick button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
.catpick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.colors { display: flex; gap: 10px; flex-wrap: wrap; }
.colors button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; }
.colors button[aria-pressed="true"] { border-color: var(--ink); }
.err { color: var(--neg); font-size: 13px; font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom)); z-index: 30; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.banner { border-radius: 12px; padding: 10px 12px; background: color-mix(in srgb, var(--warn) 14%, var(--surface)); color: var(--ink); font-size: 13px; border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.center-screen { min-height: 70vh; display: grid; place-items: center; }
.welcome { max-width: 440px; width: 100%; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"><div class="card"><div class="empty">Abrindo…</div></div></main>
</div>
<nav class="tabs" id="tabs" hidden></nav>
<button class="fab" id="fab" type="button" aria-label="Novo lançamento" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<div id="modal"></div>
<div id="toast"></div>

<script type="module" src="app.js?v=__V__"></script>
</body>
</html>
